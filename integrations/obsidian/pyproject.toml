[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "boldsound-meeting-agent"
version = "0.1.0"
description = "Local durable meeting queue and Obsidian integration for Boldsound"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "httpx>=0.27,<1", "ruamel.yaml>=0.18,<0.19", "keyring>=25,<26"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
meeting-agent = "meeting_agent.cli:main"

[tool.setuptools.packages.find]
include = ["meeting_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
